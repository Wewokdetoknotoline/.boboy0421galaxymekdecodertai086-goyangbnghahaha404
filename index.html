/* ── multi-layer decode ── */
function _dl(b64str,key){
  var out=b64str;
  for(var p=2;p>=0;p--){
    var h=2166136261;
    for(var i=0;i<key.length;i++){h^=key.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
    h=(h+p*7919)>>>0;
    var bin=atob(out),res="";
    for(var j=0;j<bin.length;j++){
      h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;
      res+=String.fromCharCode(bin.charCodeAt(j)^(h&255));
    }
    out=res;
  }
  return out;
}
